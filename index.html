<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Typing Tutor Pro - Secure</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fc;color:#17233d;overscroll-behavior:none}
header{background:linear-gradient(120deg,#172d67,#3478df);color:white;padding:18px 22px;user-select:none;cursor:pointer}
header h1{margin:0;font-size:22px}
header p{margin:6px 0 0;color:#dbe7ff;font-size:13px}
.app{max-width:1100px;margin:auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat,.panel,.lesson{background:white;border-radius:14px;padding:14px;box-shadow:0 3px 14px #17233d10}
.stat strong{display:block;font-size:22px;color:#2866ce;margin-top:4px}
.layout{display:grid;grid-template-columns:260px 1fr;gap:14px}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lesson{cursor:pointer;border:1px solid #e5eaf3;transition:.2s}
.lesson:hover{transform:translateY(-2px);border-color:#4384e9}
.lesson.locked{opacity:.6;background:#f5f6f8}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hidden{display:none}
nav button{display:block;width:100%;text-align:left;margin:6px 0;background:#edf3fc;color:#27416c}
button,select{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}
button{background:#286bd4;color:white}
footer{text-align:center;color:#8190a7;padding:20px}
#drillScreen{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#0f234d 0%, #1a3a7a 100%);display:none;flex-direction:column;padding:10px;overflow:hidden}
#drillScreen.show{display:flex}
.drillHeader{display:flex;justify-content:space-between;align-items:center;gap:8px;color:white;flex-wrap:wrap}
.drillControls{display:flex;gap:6px;flex-wrap:wrap}
.drillControls button{padding:8px 12px;font-size:13px;border-radius:20px}
.btn-pause{background:#f7b731;color:#3a2500}.btn-resume{background:#20bf6b}.btn-restart{background:#4b6584}.btn-exit{background:#eb3b5a}
.timerWrap{display:flex;align-items:center;gap:12px;margin:8px 0;color:white}
.progressSticks{display:flex;gap:5px;flex:1}
.stick{flex:1;height:14px;background:#ffffff22;border-radius:10px;transition:.4s}
.stick.green{background:linear-gradient(#2ecc71,#20bf6b);box-shadow:0 0 8px #2ecc71aa;transform:scaleY(1.4)}
.lettersRow{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:900px;margin:auto}
.keyBtn{width:72px;height:72px;background:linear-gradient(180deg,#ffffff,#e6ecf8);border-radius:14px;display:flex;justify-content:center;align-items:center;font-size:28px;font-weight:900;color:#1a2d5a;box-shadow:0 6px 0 #aab8d4, 0 8px 16px #0003;transition:.12s}
.keyBtn.space{width:200px}.keyBtn.correct{background:linear-gradient(180deg,#d6f8e0,#2ecc71)!important;color:white;transform:translateY(3px)}.keyBtn.wrong{background:linear-gradient(180deg,#ffd6d6,#eb3b5a)!important;color:white;animation:shake .25s}.keyBtn.next{outline:3px solid #ffe082}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.keyboardWrap{width:100%;max-width:820px;background:#0a1a3a;border-radius:18px;padding:12px 10px 8px;margin:10px auto 0}
.kbRow{display:flex;justify-content:center;gap:5px;margin:5px 0}
.kbKey{min-width:36px;height:42px;background:linear-gradient(180deg,#f5f7ff,#c7d2e8);border-radius:7px;display:flex;justify-content:center;align-items:center;font-size:13px;font-weight:700;color:#22335a;box-shadow:0 3px 0 #8a9ab8;transition:.1s}
.kbKey.pressed{transform:translateY(3px);background:#ffe082}.kbKey.nextKey{background:#ffe082!important;box-shadow:0 0 14px #ffe082;color:#000;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.fingers{display:flex;justify-content:center;gap:6px;margin-top:8px}
.finger{width:56px;text-align:center}.finger .dot{width:38px;height:18px;margin:0 auto;border-radius:50% 50% 4px 4px}
.finger label{font-size:9px;color:#a9bddf;display:block;margin-top:2px;font-weight:700}
.finger.active .dot{transform:scale(1.3);box-shadow:0 0 10px currentColor}
.c1{color:#ff6b6b}.c1 .dot{background:#ff6b6b}.c2{color:#feca57}.c2 .dot{background:#feca57}.c3{color:#48dbfb}.c3 .dot{background:#48dbfb}.c4{color:#1dd1a1}.c4 .dot{background:#1dd1a1}.c6{color:#f368e0}.c6 .dot{background:#f368e0}.c7{color:#00d2d3}.c7 .dot{background:#00d2d3}.c8{color:#54a0ff}.c8 .dot{background:#54a0ff}.c9{color:#feca57}.c9 .dot{background:#feca57}.c10{color:#ff6b6b}.c10 .dot{background:#ff6b6b}
.practiceArea{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:10px 0}
@media (max-width:720px){.layout{grid-template-columns:1fr}.keyBtn{width:54px;height:54px;font-size:22px}.keyBtn.space{width:140px}}
</style>
</head>
<body>
<header id="adminTrigger"><h1>⌨️ TYPING TUTOR PRO</h1><p>Learn touch typing • Tap title 5 times for Admin</p></header>
<div class="app">
<div class="topbar"><h2>My Typing Course</h2><select id="layoutSel"><option>QWERTY</option></select></div>
<div class="stats"><div class="stat">Speed <strong id="wpm">0 WPM</strong></div><div class="stat">Accuracy <strong id="acc">100%</strong></div><div class="stat">Time <strong id="time">0 sec</strong></div></div>
<div class="layout"><aside class="panel"><h3>Course Lessons</h3><nav><button onclick="showSec('lessons')">📚 All Lessons</button><button onclick="startQuick()">⌨️ Quick Practice</button><button onclick="showSec('about')">ℹ️ About</button></nav><p id="adminStatus"></p></aside>
<main><section id="lessons" class="panel"><h2>Choose Your Lesson</h2><div class="lessons" id="lessonList"></div></section><section id="about" class="panel hidden"><h2>About</h2><p>Admin can unlock all 17. Password default Gudu_Baraj-786. Tap header 5x.</p><button onclick="lockAdmin()">🔒 Lock Admin</button></section></main></div></div>
<div id="drillScreen"><div class="drillHeader"><h3 id="drillTitle">Lesson</h3><div class="timerWrap"><svg id="circleTimer" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="#ffffff22" stroke-width="4"/><circle id="timerArc" cx="22" cy="22" r="18" fill="none" stroke="#ffe082" stroke-width="4" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="0" transform="rotate(-90 22 22)"/><text id="timerText" x="22" y="26" text-anchor="middle" font-size="11" fill="white" font-weight="900">5:00</text></svg><div class="progressSticks" id="sticks"></div><div id="saveTime" style="font-size:12px;color:#ffe082;font-weight:bold"></div></div><div class="drillControls"><button class="btn-pause" id="pauseBtn" onclick="pauseDrill()">⏸️ Pause</button><button class="btn-resume hidden" id="resumeBtn" onclick="resumeDrill()">▶️ Resume</button><button class="btn-restart" onclick="restartDrill()">🔄 Restart</button><button class="btn-exit" onclick="exitDrill()">❌ Exit</button></div></div><div class="practiceArea"><div class="lettersRow" id="lettersRow"></div><div class="keyboardWrap" id="keyboardWrap"></div><div class="fingers" id="fingers"></div></div></div>
<footer>Typing Tutor Pro • Secure • SVG Animated</footer>
<script>
const ADMIN_PASS="Gudu_Baraj-786";let adminUnlocked=localStorage.getItem("tt_admin")==="1";
const lessons=[["1","Home Row","a s d f j k l ;"],["2","E and I","e i"],["3","R and U","r u"],["4","T and O","t o"],["5","Left Shift Key","a s d f"],["6","Right Shift and Period","j k l ; ."],["7","C and Comma","c ,"],["8","G H and Apostrophe","g h '"],["9","V N and Question Mark","v n ?"],["10","W and M","w m"],["11","Q and P","q p"],["12","B and Y","b y"],["13","Z and X","z x"],["14","Number Row","1 2 3 4 5 6 7 8 9 0"],["15","Symbols","! @ # $ % ^ & *"],["16","Special Keys","space enter tab backspace"],["17","Other Keyboard Keys","caps ctrl alt delete arrows"]];
let selected=0,targetSeq=[],curIdx=0,correct=0,total=0,timerInt=null,timeLeft=300,paused=false,greenSticks=0,streak=0;
const $=id=>document.getElementById(id);
const fingerMap={"q":"c1","a":"c1","z":"c1","w":"c2","s":"c2","x":"c2","e":"c3","d":"c3","c":"c3","r":"c4","f":"c4","v":"c4","t":"c4","g":"c4","b":"c4","y":"c7","h":"c7","n":"c7","u":"c7","j":"c7","m":"c7","i":"c8","k":"c8",",":"c8","o":"c9","l":"c9",".":"c9","p":"c10",";":"c10","/":"c10","'":"c10"," ":"c6"};
const fingerClasses=["c1","c2","c3","c4","c4","c7","c7","c8","c9","c10"];
function showSec(n){["lessons","about"].forEach(id=>$(id).classList.add("hidden"));$(n).classList.remove("hidden");}
function lockAdmin(){localStorage.removeItem("tt_admin");adminUnlocked=false;renderLessons();alert("Admin Locked");}
let clicks=0,clickTimer=null;$("adminTrigger").addEventListener("click",()=>{clicks++;clearTimeout(clickTimer);clickTimer=setTimeout(()=>clicks=0,2000);if(clicks>=5){clicks=0;let p=prompt("Enter Admin Password:");if(p===ADMIN_PASS){localStorage.setItem("tt_admin","1");adminUnlocked=true;renderLessons();alert("✅ Admin Unlocked");}else if(p!==null)alert("❌ Wrong");}});
function renderLessons(){$("lessonList").innerHTML="";lessons.forEach((l,i)=>{let free=i<4||adminUnlocked;let div=document.createElement("div");div.className="lesson "+(free?"":"locked");div.innerHTML=`<h3>Lesson ${l[0]}: ${l[1]}</h3><small>${free?"✅ Available":"🔒 PREMIUM Locked"}</small>`;div.onclick=()=>openLesson(i);$("lessonList").appendChild(div);});$("adminStatus").innerHTML=adminUnlocked?`<small style="color:green;font-weight:bold">✅ ADMIN MODE: All Unlocked<br><button onclick="lockAdmin()">Lock</button></small>`:`<small>FREE:1-4<br>PREMIUM:5-17 Admin Only - tap title 5x</small>`;}
function openLesson(i){if(i>=4&&!adminUnlocked){alert("🔒 Premium Locked. Admin only.");return;}selected=i;startDrill();}
function startQuick(){selected=0;startDrill();}
function generateSequence(){let base=lessons[selected][2].toLowerCase().replace("space"," ").split(" ").filter(x=>x);let len=greenSticks<3?6:greenSticks<6?9:12;let seq=[];for(let i=0;i<len;i++){let w=base[Math.floor(Math.random()*base.length)];seq.push(w);}let flat=seq.join(" ").split("").filter(c=>c.trim()!==""||c===" ");return flat.slice(0,12);}
function buildKeyboard(){let rows=[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l",";","'"],["z","x","c","v","b","n","m",",",".","/"]];let wrap=$("keyboardWrap");wrap.innerHTML="";rows.forEach(r=>{let div=document.createElement("div");div.className="kbRow";r.forEach(k=>{let key=document.createElement("div");key.className="kbKey";key.id="vk-"+k;key.textContent=k;key.dataset.finger=fingerMap[k]||"c6";div.appendChild(key);});wrap.appendChild(div);});let sr=document.createElement("div");sr.className="kbRow";let sp=document.createElement("div");sp.className="kbKey";sp.style.flex="1";sp.style.maxWidth="260px";sp.id="vk- ";sp.textContent="SPACE";sr.appendChild(sp);wrap.appendChild(sr);let fWrap=$("fingers");fWrap.innerHTML="";["Pinky L","Ring L","Middle L","Index L","Index L","Index R","Index R","Middle R","Ring R","Pinky R"].forEach((lbl,i)=>{let fd=document.createElement("div");fd.className="finger "+fingerClasses[i];fd.id="finger-"+i;fd.innerHTML=`<div class="dot"></div><label>${lbl}</label>`;fWrap.appendChild(fd);});}
function buildSticks(){let s=$("sticks");s.innerHTML="";for(let i=0;i<10;i++){let d=document.createElement("div");d.className="stick";d.id="stick-"+i;s.appendChild(d);}}
function startDrill(){$("drillScreen").classList.add("show");$("drillTitle").textContent="Lesson "+lessons[selected][0]+": "+lessons[selected][1];buildKeyboard();buildSticks();greenSticks=0;streak=0;correct=0;total=0;curIdx=0;timeLeft=300;paused=false;$("pauseBtn").classList.remove("hidden");$("resumeBtn").classList.add("hidden");$("saveTime").textContent="";startTimer();nextSequence();}
function nextSequence(){targetSeq=generateSequence();curIdx=0;renderLetters();highlightNext();}
function renderLetters(){let row=$("lettersRow");row.innerHTML="";targetSeq.forEach((ch,i)=>{let b=document.createElement("div");b.className="keyBtn"+(ch===" "?" space":"");b.id="lb-"+i;b.textContent=ch===" "?"⎵":ch.toUpperCase();if(i===0)b.classList.add("next");row.appendChild(b);});}
function highlightNext(){document.querySelectorAll(".kbKey").forEach(k=>k.classList.remove("nextKey"));document.querySelectorAll(".finger").forEach(f=>f.classList.remove("active"));if(curIdx>=targetSeq.length)return;let ch=targetSeq[curIdx].toLowerCase();let vk=$("vk-"+(ch===" "?" ":ch));if(vk){vk.classList.add("nextKey");let fm=vk.dataset.finger;let idx=fingerClasses.indexOf(fm);if(idx>=0)$("finger-"+idx)?.classList.add("active");}}
function startTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{if(paused)return;timeLeft--;if(timeLeft<0)timeLeft=0;updateTimerUI();if(timeLeft<=0)finishDrill(true);},1000);updateTimerUI();}
function updateTimerUI(){let m=Math.floor(timeLeft/60),s=timeLeft%60;$("timerText").textContent=`${m}:${String(s).padStart(2,"0")}`;let pct=timeLeft/300;let off=113*(1-pct);$("timerArc").style.strokeDashoffset=off;}
function pauseDrill(){paused=true;$("pauseBtn").classList.add("hidden");$("resumeBtn").classList.remove("hidden");}
function resumeDrill(){paused=false;$("pauseBtn").classList.remove("hidden");$("resumeBtn").classList.add("hidden");}
function restartDrill(){startDrill();}
function exitDrill(){clearInterval(timerInt);$("drillScreen").classList.remove("show");renderLessons();}
function finishDrill(t){clearInterval(timerInt);if(!t&&greenSticks>=10){let saved=timeLeft;$("saveTime").textContent=`Save Time: ${saved}s`;setTimeout(()=>{if(confirm(`🎉 Completed! Save Time ${saved}s. Next Lesson?`)){selected=Math.min(lessons.length-1,selected+1);startDrill();}else exitDrill();},400);}else if(t){alert(`⏰ Time Up!\nSpeed: ${calcWPM()} WPM\nAccuracy: ${calcAcc()}%`);exitDrill();}}
function calcWPM(){let sec=Math.max(1,300-timeLeft);return Math.round((total/5)/(sec/60));}
function calcAcc(){return total?Math.round(correct/total*100):100;}
document.addEventListener("keydown",e=>{if(!$("drillScreen").classList.contains("show")||paused)return;if(e.key==="Escape"){exitDrill();return;}if(e.key===" ")e.preventDefault();let pressed=e.key.toLowerCase();let vk=$("vk-"+(pressed===" "?" ":pressed));if(vk){vk.classList.add("pressed");setTimeout(()=>vk.classList.remove("pressed"),150);}if(curIdx>=targetSeq.length)return;let expected=targetSeq[curIdx].toLowerCase();let input=pressed;if(expected===" "&&e.code==="Space")input=" ";if(input.length!==1&&input!==" ")return;total++;let lb=$("lb-"+curIdx);if(input===expected){lb.classList.add("correct");lb.classList.remove("next");correct++;streak++;if(streak>=5){greenSticks=Math.min(10,greenSticks+1);let st=$("stick-"+(greenSticks-1));if(st)st.classList.add("green");streak=0;}curIdx++;if(curIdx>=targetSeq.length){setTimeout(()=>{nextSequence();if(greenSticks>=10)finishDrill(false);},250);}else{let nl=$("lb-"+curIdx);if(nl)nl.classList.add("next");highlightNext();}}else{lb.classList.add("wrong");setTimeout(()=>lb.classList.remove("wrong"),300);streak=Math.max(0,streak-1);}let wpm=calcWPM();let acc=calcAcc();$("wpm").textContent=wpm+" WPM";$("acc").textContent=acc+"%";$("time").textContent=(300-timeLeft)+" sec";});
renderLessons();showSec("lessons");
</script>
</body>
  </html>
