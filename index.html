<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TypingMaster Junior - 17 Lessons</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dbe6f6;font-family:Arial,Helvetica,sans-serif;color:#2a3a5a}
.topLogo{background:#eef3ff;padding:10px 18px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #c5d5f0;user-select:none}
.topLogo b{color:#0b3aa8;font-size:22px}
.mainFrame{max-width:1080px;margin:10px auto;background:white;border-radius:8px;overflow:hidden;box-shadow:0 8px 24px #0002;border:1px solid #b8c9e8}
.courseHeader{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#f7f9ff;border-bottom:1px solid #dde6f5}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tab{width:28px;height:23px;display:flex;justify-content:center;align-items:center;font-size:12px;border-radius:4px;cursor:pointer;color:#6b7a9a;background:#eef2fb;border:1px solid #d6e2f5}
.tab.active{background:#1a4fc0;color:white;font-weight:900;transform:scale(1.15)}
.lessonView{display:grid;grid-template-columns:1fr 200px;min-height:440px}
.leftContent{padding:18px 22px;background:white}
.leftContent h3{margin:0 0 14px;text-align:center;font-size:18px}
.subList{display:flex;flex-direction:column;gap:10px;max-width:400px;margin:0 auto}
.subItem{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #d6e2f5;border-radius:8px;background:linear-gradient(180deg,#fff,#eef3ff);cursor:pointer;font-size:13px}
.subItem.locked{opacity:.6;background:#f2f3f5}
.bottomNav{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:10px}
.navBtn{width:42px;height:42px;border-radius:50%;background:#2a9df4;color:white;display:flex;justify-content:center;align-items:center;font-size:20px;cursor:pointer}
.courseFooter{display:grid;grid-template-columns:1fr 1fr;gap:20px;background:#f1f5ff;padding:12px 18px;border-top:1px solid #dde6f5}
.progressBar{height:14px;background:white;border:1px solid #c5d5f0;border-radius:3px;overflow:hidden}
.progressFill{height:100%;background:linear-gradient(90deg,#7ab8ff,#1a4fc0);width:25%}
.rightPanel{background:#f7f9ff;border-left:1px solid #dde6f5;padding:0}
.kbSwitch{display:flex;gap:4px;padding:8px 14px;flex-wrap:wrap}
.kbSwitch button{padding:4px 8px;border-radius:12px;font-size:10px;border:1px solid #b8c9e8;background:#eef3ff;cursor:pointer}
.kbSwitch button.active{background:#0b3aa8;color:white}
.rBtn{display:flex;gap:10px;padding:11px 14px;font-size:12px;font-weight:700;cursor:pointer;border-left:4px solid transparent;color:#4a5a7a}
.rBtn.active{background:#dbe9ff;border-left-color:#1a4fc0;color:#0b3aa8}
#drillScreen{position:fixed;inset:0;z-index:99999;background:linear-gradient(180deg,#081b3f,#204ba6);display:none;flex-direction:column;padding:10px}
#drillScreen.show{display:flex}
.keyBtn{width:54px;height:54px;background:linear-gradient(180deg,#fff,#c9d8f5);border-radius:8px;display:flex;justify-content:center;align-items:center;font-size:18px;font-weight:900;color:#0b2d7a;box-shadow:0 3px 0 #7a8eb8}
.keyBtn.correct{background:#1bb65d!important;color:white}.keyBtn.wrong{background:#e23b3b!important;color:white}.keyBtn.next{outline:3px solid #ffde59}
.lettersRow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:900px;margin:0 auto}
.keyboardWrap{max-width:820px;margin:10px auto 0;background:#07132f;border-radius:14px;padding:10px}
.kbRow{display:flex;justify-content:center;gap:4px;margin:4px 0}
.kbKey{min-width:32px;height:38px;background:linear-gradient(180deg,#eef3ff,#a8b8d8);border-radius:6px;display:flex;justify-content:center;align-items:center;font-size:12px;font-weight:800;color:#0b2d7a}
.kbKey.nextKey{background:#ffde59!important;box-shadow:0 0 10px #ffde59;color:black}.kbKey.pressed{transform:translateY(2px)}
.fingers{display:flex;justify-content:center;gap:5px;margin-top:6px}.finger{width:48px;text-align:center}.finger .dot{width:32px;height:13px;margin:0 auto;border-radius:50% 50% 4px 4px;transition:.18s}.finger.push .dot{transform:translateY(10px) scale(1.2)}.finger.active .dot{transform:scale(1.2)}
.tower{flex:1;height:14px;background:#ffffff22;border-radius:8px}.tower.green{background:linear-gradient(#7af3a7,#1bb65d)}
@media(max-width:800px){.lessonView{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topLogo" id="logoTrigger"><div style="width:28px;height:28px;background:#0b3aa8;border-radius:50%;color:white;display:flex;justify-content:center;align-items:center;font-weight:900">T</div><b>TypingMaster</b></div>
<div class="mainFrame">
<div class="courseHeader"><div><h2>Junior Typing Course</h2><div class="tabs" id="tabs"></div></div><div style="font-size:12px">Close</div></div>
<div class="lessonView">
<div class="leftContent">
<h3 id="lessonTitle">Lesson 1: The Home Row</h3>
<div class="subList" id="subList"></div>
<div class="bottomNav"><div style="text-align:center;cursor:pointer" onclick="prevLesson()"><div class="navBtn">◀</div><small>Lesson <span id="prevL">1</span></small></div><div style="text-align:center;cursor:pointer" onclick="nextLesson()"><div class="navBtn">▶</div><small>Lesson <span id="nextL">2</span></small></div></div>
<div class="courseFooter"><div><small>Course progress</small><div class="progressBar"><div class="progressFill" id="progFill"></div></div></div><div><button style="width:100%;background:#2a9df4;color:white;border:0;padding:8px;border-radius:6px;font-weight:700">Change course</button><button style="width:100%;margin-top:6px;background:white;border:1px solid #c5d5f0;padding:6px;border-radius:20px;font-size:11px">Adjust course duration</button></div></div>
</div>
<div class="rightPanel">
<div class="kbSwitch"><button class="active">QWERTY</button><button>AZERTY</button><button>QWERTZ</button><button>DVORAK</button></div>
<div class="rBtn active">STUDYING</div><div class="rBtn">TYPING METER</div><div class="rBtn">CUSTOM REVIEW</div><div class="rBtn">TYPING TEST</div><div class="rBtn">GAMES</div><div class="rBtn">STATISTICS</div><div class="rBtn">SETTINGS</div><div class="rBtn">ABOUT</div>
</div>
</div>
</div>
<div id="drillScreen">
<div style="display:flex;justify-content:space-between;align-items:center;color:white;flex-wrap:wrap;gap:8px"><h3 id="drillTitle" style="margin:0">Lesson</h3><div style="display:flex;gap:5px"><button onclick="pauseDrill()" id="pauseBtn" style="background:#f7b731;color:black;padding:5px 8px;border-radius:14px;border:0;font-weight:700">Pause</button><button onclick="resumeDrill()" id="resumeBtn" style="display:none;background:#1bb65d;color:white;padding:5px 8px;border-radius:14px;border:0">Resume</button><button onclick="restartDrill()" style="background:#4b6584;color:white;padding:5px 8px;border-radius:14px;border:0">Restart</button><button onclick="exitDrill()" style="background:#e23b3b;color:white;padding:5px 8px;border-radius:14px;border:0">Exit</button></div></div>
<div style="display:flex;gap:4px;margin:8px 0" id="sticks"></div>
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px">
<div id="tipsArea" style="display:none;width:95%;max-width:700px"></div>
<div class="lettersRow" id="lettersRow"></div>
<div class="keyboardWrap" id="keyboardWrap"></div><div class="fingers" id="fingers"></div><div id="saveTime" style="color:#ffde59;font-weight:900"></div>
</div>
</div>
<script>
const PASS="786786";
let adminUnlocked=localStorage.getItem("tt_admin")==="1";
let curLesson=1, selectedSub="", targetSeq=[], curIdx=0, timeLeft=300, timerInt=null, paused=false, greenSticks=0, introStep=0;
const lessonsData=[
{id:1,title:"The Home Row",subs:[["1.1","Learning tips","tips"],["1.2","New keys: Home row","newkeys","a s d f j k l ;"],["1.3","Word drill","word","a s d f j k l ;"],["1.4","Sentence drill","sentence","a s d f j k l ;"],["1.5","WordTris game","wordtris","a s d f j k l ;"],["1.6","Skills test","skilltest","a s d f j k l ;"]]},
{id:2,title:"E and I",subs:[["2.1","New keys : E I","newkeys","e i"],["2.2","Word drill","word","e i"],["2.3","Sentence drill","sentence","e i"],["2.4","Computer ergonomics","tips"],["2.5","WordTris game","wordtris","e i"],["2.6","Skills test","skilltest","e i"]]},
{id:3,title:"R and U",subs:[["3.1","New keys R U","newkeys","r u"],["3.2","Word drill","word","r u"],["3.3","Sentence drill","sentence","r u"],["3.4","WordTris game","wordtris","r u"],["3.5","Skills test","skilltest","r u"]]},
{id:4,title:"T and O",subs:[["4.1","New keys T O","newkeys","t o"],["4.2","Word drill","word","t o"],["4.3","Sentence drill","sentence","t o"],["4.4","WordTris game","wordtris","t o"],["4.5","Skills test","skilltest","t o"]]},
{id:5,title:"Left Shift Key",subs:[["5.1","The Shift key","tips"],["5.2","New keys Left Shift","newkeys","A S D F"],["5.3","Word drill","word","A S D F"],["5.4","Sentence drill","sentence","A S D F"],["5.5","WordTris game","wordtris","A S D F"],["5.6","Skills test","skilltest","A S D F"]]},
{id:6,title:"Right Shift and Period",subs:[["6.1","New keys Right Shift","newkeys","J K L ;"],["6.2","Word drill","word","J K L ;"],["6.3","New key Period","newkeys","."],["6.4","Sentence drill","sentence","."],["6.5","WordTris game","wordtris","."],["6.6","Skills test","skilltest","."]]},
{id:7,title:"C and Comma",subs:[["7.1","New keys C ,","newkeys","c ,"],["7.2","Word drill","word","c ,"],["7.3","Sentence drill","sentence","c ,"],["7.4","WordTris game","wordtris","c ,"],["7.5","Skills test","skilltest","c ,"]]},
{id:8,title:"G H and Apostrophe",subs:[["8.1","New keys: G H","newkeys","g h"],["8.2","Word drill","word","g h"],["8.3","New key: '","newkeys","'"],["8.4","Sentence drill","sentence","g h '"],["8.5","WordTris game","wordtris","g h '"],["8.6","Skills test","skilltest","g h '"]]},
{id:9,title:"V N and ?",subs:[["9.1","New keys: V N","newkeys","v n"],["9.2","Word drill","word","v n"],["9.3","New key: ?","newkeys","?"],["9.4","Sentence drill","sentence","v n ?"],["9.5","WordTris game","wordtris","v n ?"],["9.6","Skills test","skilltest","v n ?"]]},
{id:10,title:"Keys W and M",subs:[["10.1","New keys: W M","newkeys","w m"],["10.2","Word drill","word","w m"],["10.3","Sentence drill","sentence","w m"],["10.4","WordTris game","wordtris","w m"],["10.5","Skills test","skilltest","w m"]]},
{id:11,title:"Keys Q and P",subs:[["11.1","New keys: Q P","newkeys","q p"],["11.2","Word drill","word","q p"],["11.3","Sentence drill","sentence","q p"],["11.4","Wordtris game","wordtris","q p"],["11.5","Skills test","skilltest","q p"]]},
{id:12,title:"Keys B and Y",subs:[["12.1","New keys: B Y","newkeys","b y"],["12.2","Word drill","word","b y"],["12.3","Sentence drill","sentence","b y"],["12.4","WordTris game","wordtris","b y"],["12.5","Skills test","skilltest","b y"]]},
{id:13,title:"Keys Z and X",subs:[["13.1","New keys: Z X","newkeys","z x"],["13.2","Word drill","word","z x"],["13.3","Sentence drill","sentence","z x"],["13.4","WordTris game","wordtris","z x"],["13.5","Skills test","skilltest","z x"]]},
{id:14,title:"Numbers Row",subs:[["14.1","New keys: 1 2 3 4 5","newkeys","1 2 3 4 5"],["14.2","New keys: 6 7 8 9 0","newkeys","6 7 8 9 0"],["14.3","Word drill Numbers","word","1 2 3 4 5 6 7 8 9 0"],["14.4","Sentence drill","sentence","1 2 3 4 5 6 7 8 9 0"],["14.5","Skills test","skilltest","1 2 3 4 5 6 7 8 9 0"]]},
{id:15,title:"Symbols",subs:[["15.1","New keys: ! @ # $ %","newkeys","! @ # $ %"],["15.2","New keys: ^ & * ( )","newkeys","^ & * ( )"],["15.3","Word drill Symbols","word","! @ # $ % ^ & *"],["15.4","Skills test","skilltest","! @ # $ % ^ & * ( )"]]},
{id:16,title:"Capital Letters Review",subs:[["16.1","Review Capitals","newkeys","A B C D E F G"],["16.2","Word drill Capitals","word","A B C D E F G H I J"],["16.3","Sentence drill","sentence","A B C D E F"],["16.4","Skills test","skilltest","A B C D E F G H I J"]]},
{id:17,title:"Final Skills Test",subs:[["17.1","Final Review Tips","tips"],["17.2","All Keys Test","skilltest","a b c d e f g h i j k l m n o p q r s t u v w x y z"],["17.3","Speed Test","skilltest","The quick brown fox jumps over the lazy dog"]]},
];
const introSteps=[
{title:"Let's get started - here are the home keys<br>A S D F and J K L ;<br><small>Press Space to continue</small>", keys:["a","s","d","f","j","k","l",";"]},
{title:"Left hand first: Place fingers on A, S, D and F.<br><small>Press Space to continue</small>", keys:["a","s","d","f"]},
{title:"Now the right hand: Place fingers on J, K, L and semicolon.<br><small>Press Space to continue</small>", keys:["j","k","l",";"]},
{title:"Rest both thumbs lightly on the space bar.<br><small>Press Space to continue</small>", keys:[]},
{title:"Home row is the starting point to touch typing.<br><small>Press Space to continue</small>", keys:["a","s","d","f","j","k","l",";"]},
{title:"Great! You can now start the first practice drill.<br><small>Press Space to continue</small>", keys:["a","s","d","f","j","k","l",";"]}
];
const $=id=>document.getElementById(id);
const fingerMap={"q":"c1","a":"c1","z":"c1","w":"c2","s":"c2","x":"c2","e":"c3","d":"c3","c":"c3","r":"c4","f":"c4","v":"c4","t":"c4","g":"c4","b":"c4","y":"c7","h":"c7","n":"c7","u":"c7","j":"c7","m":"c7","i":"c8","k":"c8",",":"c8","o":"c9","l":"c9",".":"c9","p":"c10",";":"c10"};
const fingerClasses=["c1","c2","c3","c4","c4","c7","c7","c8","c9","c10"];
const colors=["#4a90e2","#e94e4e","#7ac74f","#9b8ec4","#9b8ec4","#9b8ec4","#9b8ec4","#7ac74f","#e94e4e","#4a90e2"];
function buildTabs(){$("tabs").innerHTML="";lessonsData.forEach(l=>{let free=l.id<=2||adminUnlocked;let div=document.createElement("div");div.className="tab"+(l.id===curLesson?" active":"")+(free?"":" locked");div.textContent=l.id;div.onclick=()=>{curLesson=l.id;buildTabs();buildLesson();};$("tabs").appendChild(div);});}
function buildLesson(){let l=lessonsData.find(x=>x.id===curLesson);$("lessonTitle").textContent=`Lesson ${l.id}: ${l.title}`;$("prevL").textContent=Math.max(1,l.id-1);$("nextL").textContent=Math.min(17,l.id+1);$("progFill").style.width=(l.id/17*100)+"%";let free=l.id<=2||adminUnlocked;$("subList").innerHTML="";l.subs.forEach(s=>{let div=document.createElement("div");div.className="subItem"+(free?"":" locked");div.innerHTML=`<div style="width:18px;height:18px;border-radius:50%;background:#e6eaf2;display:flex;justify-content:center;align-items:center;font-size:10px">${free?"":"🔒"}</div><b>${s[0]}</b> <span style="text-decoration:underline">${s[1]}</span>`;div.onclick=()=>{if(!free)return;selectedSub=s[0];startSubLesson(l.id,s);};$("subList").appendChild(div);});}
function prevLesson(){curLesson=Math.max(1,curLesson-1);buildTabs();buildLesson();}function nextLesson(){curLesson=Math.min(17,curLesson+1);buildTabs();buildLesson();}
function buildKb(){let layout=["qwertyuiop","asdfghjkl;'","zxcvbnm,./"];let wrap=$("keyboardWrap");wrap.innerHTML="";layout.forEach(r=>{let div=document.createElement("div");div.className="kbRow";[...r].forEach(k=>{let key=document.createElement("div");key.className="kbKey";key.id="vk-"+k;key.textContent=k;key.dataset.finger=fingerMap[k]||"c6";div.appendChild(key);});wrap.appendChild(div);});let sr=document.createElement("div");sr.className="kbRow";let sp=document.createElement("div");sp.className="kbKey";sp.style.flex="1";sp.style.maxWidth="220px";sp.id="vk- ";sp.textContent="SPACE";sr.appendChild(sp);wrap.appendChild(sr);let fw=$("fingers");fw.innerHTML="";["Pinky","Ring","Middle","Index","Index","Index","Index","Middle","Ring","Pinky"].forEach((lbl,i)=>{let fd=document.createElement("div");fd.className="finger";fd.id="finger-"+i;fd.innerHTML=`<div class="dot" style="background:${colors[i]}"></div>`;fw.appendChild(fd);});}
function buildSticks(){let s=$("sticks");s.innerHTML="";for(let i=0;i<10;i++){let d=document.createElement("div");d.className="tower";d.id="stick-"+i;s.appendChild(d);}}
function startSubLesson(lessonId, sub){
currentType=sub[2];let keys=sub[3]||"a s d f";$("drillScreen").classList.add("show");$("drillTitle").textContent=`Lesson ${lessonId}: ${sub[1]}`;buildKb();buildSticks();greenSticks=0;timeLeft=300;paused=false;$("pauseBtn").style.display="inline-block";$("resumeBtn").style.display="none";$("saveTime").textContent="";$("tipsArea").style.display="none";
if(sub[0]==="1.1"){introStep=0;showIntroStep();return;}
if(currentType==="tips"){showTips(sub);}else{startDrill(keys,currentType);}
}
function showIntroStep(){let step=introSteps[introStep];$("tipsArea").style.display="block";$("lettersRow").style.display="none";$("keyboardWrap").style.display="none";$("fingers").style.display="none";$("tipsArea").innerHTML=`<div style="background:white;border-radius:10px;padding:18px"><div style="font-size:16px;line-height:1.5;color:#1a2a4a;text-align:center">${step.title}</div><div style="margin-top:16px;display:flex;justify-content:flex-end;gap:8px"><button onclick="introNext()" style="background:#1a7ae8;color:white;padding:9px 26px;border-radius:6px;border:0;font-weight:700;cursor:pointer">Next</button><button onclick="exitDrill()" style="background:#eef2ff;border:1px solid #d6e2f5;padding:8px 16px;border-radius:6px">Cancel</button></div></div>`;}
function introNext(){introStep++;if(introStep<introSteps.length){showIntroStep();}else{let l=lessonsData.find(x=>x.id===curLesson);let sub=l.subs.find(x=>x[0]==="1.2");selectedSub=sub[0];startSubLesson(curLesson,sub);}}
function showTips(sub){$("tipsArea").style.display="block";$("lettersRow").style.display="none";$("keyboardWrap").style.display="none";$("fingers").style.display="none";$("tipsArea").innerHTML=`<div style="background:#fff9db;padding:14px;border-radius:10px;border:1px solid #ffe58f"><b>${sub[1]}</b><br><br>Keys: ${sub[3]||""}<br><br><button onclick="nextSub()" style="background:#0b3aa8;color:white;padding:8px 16px;border-radius:20px;border:0">Continue</button></div>`;}
function nextSub(){let l=lessonsData.find(x=>x.id===curLesson);let idx=l.subs.findIndex(x=>x[0]===selectedSub);if(idx<l.subs.length-1){selectedSub=l.subs[idx+1][0];startSubLesson(curLesson,l.subs[idx+1]);}else{exitDrill();}}
function getCumulativeKeys(lessonId, currentKeysStr){let all=[];for(let i=1;i<lessonId;i++){let ld=lessonsData.find(x=>x.id===i);if(ld){ld.subs.forEach(s=>{if(s[2]==="newkeys"&&s[3]) all.push(...s[3].split(" ").filter(x=>x));});}}all.push(...currentKeysStr.split(" ").filter(x=>x));return [...new Set(all)];}
function startDrill(keysStr,type){let pool=type==="word"||type==="sentence"||type==="skilltest"? getCumulativeKeys(curLesson,keysStr) : keysStr.split(" ").filter(x=>x);let seq=[];for(let i=0;i<20;i++){if(type==="newkeys"){seq.push(pool[Math.floor(Math.random()*pool.length)]);}else{let w="";let len=type==="newkeys"?1:2+Math.floor(Math.random()*3);for(let k=0;k<len;k++) w+=pool[Math.floor(Math.random()*pool.length)];seq.push(w);}}targetSeq=seq.join(" ").split("");curIdx=0;renderLetters();highlightNext();startTimer();}
function renderLetters(){let row=$("lettersRow");row.innerHTML="";row.style.display="flex";targetSeq.forEach((ch,i)=>{let b=document.createElement("div");b.className="keyBtn";b.id="lb-"+i;b.textContent=ch===" "?"Space":ch.toUpperCase();if(i===0)b.classList.add("next");row.appendChild(b);});}
function highlightNext(){document.querySelectorAll(".kbKey").forEach(k=>k.classList.remove("nextKey"));document.querySelectorAll(".finger").forEach(f=>{f.classList.remove("active");f.classList.remove("push");});if(curIdx>=targetSeq.length)return;let ch=targetSeq[curIdx].toLowerCase();let vk=$("vk-"+ch);if(vk){vk.classList.add("nextKey");let fm=vk.dataset.finger;let idx=fingerClasses.indexOf(fm);if(idx>=0)$("finger-"+idx)?.classList.add("active");}}
function startTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{if(paused)return;timeLeft--;if(timeLeft<=0){exitDrill();}},1000);}
function pauseDrill(){paused=true;$("pauseBtn").style.display="none";$("resumeBtn").style.display="inline-block";}function resumeDrill(){paused=false;$("pauseBtn").style.display="inline-block";$("resumeBtn").style.display="none";}function restartDrill(){let l=lessonsData.find(x=>x.id===curLesson);let sub=l.subs.find(x=>x[0]===selectedSub);startSubLesson(curLesson,sub);}function exitDrill(){clearInterval(timerInt);$("drillScreen").classList.remove("show");}
document.addEventListener("keydown",e=>{
if(!$("drillScreen").classList.contains("show")||paused)return;
if($("tipsArea").style.display==="block"&&selectedSub==="1.1"){if(e.code==="Space"){e.preventDefault();introNext();}return;}
if(e.key===" ") e.preventDefault();
let pressed=e.key.toLowerCase();let vk=$("vk-"+pressed);if(vk){vk.classList.add("pressed");setTimeout(()=>vk.classList.remove("pressed"),150);}
if(curIdx>=targetSeq.length)return;let expected=targetSeq[curIdx].toLowerCase();
if(pressed===expected||(expected===" "&&e.code==="Space")){
let lb=$("lb-"+curIdx);if(lb){lb.classList.add("correct");lb.classList.remove("next");}greenSticks=Math.min(10,greenSticks+0.6);let st=$("stick-"+Math.floor(greenSticks));if(st)st.classList.add("green");curIdx++;if(curIdx>=targetSeq.length){setTimeout(()=>{if(greenSticks>=10){$("saveTime").textContent=`Saving Time: ${timeLeft}s`;setTimeout(()=>nextSub(),600);}else{let l=lessonsData.find(x=>x.id===curLesson);let sub=l.subs.find(x=>x[0]===selectedSub);startDrill(sub[3],sub[2]);}},200);}else{let nl=$("lb-"+curIdx);if(nl)nl.classList.add("next");highlightNext();}
}else{let lb=$("lb-"+curIdx);if(lb){lb.classList.add("wrong");setTimeout(()=>lb.classList.remove("wrong"),200);}}
});
// خفیہ انلاک - صرف آپ کو پتا ہے
let clicks=0,ct=null;
$("logoTrigger").addEventListener("click",()=>{
clicks++;clearTimeout(ct);ct=setTimeout(()=>clicks=0,2000);
if(clicks>=5){clicks=0;let p=prompt("Enter Code:");if(p===PASS){localStorage.setItem("tt_admin","1");adminUnlocked=true;buildTabs();buildLesson();}}
});
buildTabs();buildLesson();
